<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mirror Image</title>
  <meta name="description" content="本地数字孪生：浇灌私料，改写未来三个月的人生路径图。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="shell">
    <aside class="rail">
      <div class="brand-block">
        <h1 class="brand">Mirror Image</h1>
        <p class="brand-sub">数字孪生 · 浇灌 · 路径</p>
      </div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-view="chat" role="tab">会话</button>
        <button type="button" class="tab" data-view="paths" role="tab">人生路径</button>
      </nav>

      <div class="meters" id="meters">
        <div class="meter"><span>capital</span><strong id="m-capital">—</strong></div>
        <div class="meter"><span>energy</span><strong id="m-energy">—</strong></div>
        <div class="meter"><span>entropy</span><strong id="m-entropy">—</strong></div>
        <div class="meter"><span>memory</span><strong id="m-memory">—</strong></div>
      </div>

      <div
        class="drop"
        id="drop"
        tabindex="0"
        role="button"
        aria-label="拖放文件以浇灌记忆"
      >
        <div class="drop-ripple" aria-hidden="true"></div>
        <h2>浇灌</h2>
        <p>拖入日记 / PDF / 照片。<br />浇灌后，未来三月路径会改写，旧图进入历史。</p>
        <input id="fileInput" type="file" multiple hidden />
        <div class="drop-status" id="dropStatus">等待材料</div>
      </div>

      <label class="note-label" for="noteInput">快速日记</label>
      <textarea
        id="noteInput"
        rows="3"
        placeholder="今天发生了什么… Cmd/Ctrl+Enter 浇灌"
      ></textarea>
      <button type="button" class="btn btn-ghost" id="noteBtn">写入记忆并改写路径</button>

      <div class="tool-row">
        <button type="button" class="btn btn-ghost" id="boardBtn">/board</button>
        <button type="button" class="btn btn-ghost" id="simBtn">/simulate</button>
      </div>

      <p class="rail-foot" id="healthLine">connecting…</p>
    </aside>

    <main class="stage">
      <section class="view view-chat" id="view-chat">
        <header class="stage-head">
          <span class="sys">镜面会话</span>
          <span class="sys dim" id="modelLine"></span>
        </header>
        <div class="log" id="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <textarea
            id="prompt"
            rows="2"
            placeholder="对镜子说话… 含「推演」或「做选择」会走物理状态机"
            required
          ></textarea>
          <button class="btn" type="submit" id="sendBtn">发送</button>
        </form>
      </section>

      <section class="view view-paths hidden" id="view-paths">
        <header class="stage-head paths-head">
          <div>
            <span class="sys">人生路径 · 未来 3 个月</span>
            <p class="path-summary" id="pathSummary">加载中…</p>
          </div>
          <div class="path-actions">
            <button type="button" class="btn btn-ghost" id="regenPathBtn">重新推演</button>
          </div>
        </header>

        <div class="legend">
          <span><i class="swatch closed"></i> 已关闭</span>
          <span><i class="swatch open"></i> 仍开放</span>
          <span><i class="swatch today"></i> 今天</span>
        </div>

        <div class="path-canvas-wrap">
          <svg id="pathSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="人生路径图"></svg>
        </div>

        <aside class="path-detail" id="pathDetail">
          <h3>节点</h3>
          <p>点选图上的方块，查看细节与状态增量。</p>
        </aside>

        <div class="history-panel">
          <div class="history-head">
            <span class="sys">浇灌前的路径历史</span>
            <span class="sys dim" id="historyCount">0</span>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="overlay" aria-hidden="true">
    <div class="modal">
      <h3 id="modalTitle">沙盒</h3>
      <textarea id="modalInput" rows="4"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel">取消</button>
        <button type="button" class="btn" id="modalOk">运行</button>
      </div>
    </div>
  </div>

  <script src="/assets/life-path.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
