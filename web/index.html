<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Twin</title>
  <meta name="description" content="数字分身：浇灌日记与影像，看看接下来三个月的路。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand-block">
        <p class="brand-kicker">数字分身</p>
        <h1 class="brand">Digital Twin</h1>
        <p class="brand-sub">慢慢浇灌，路会自己长出来。</p>
      </div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-view="chat" role="tab">聊聊</button>
        <button type="button" class="tab" data-view="paths" role="tab">人生小路</button>
      </nav>

      <div class="meters" id="meters">
        <div class="meter"><span>储备</span><strong id="m-capital">—</strong></div>
        <div class="meter"><span>精力</span><strong id="m-energy">—</strong></div>
        <div class="meter"><span>混乱</span><strong id="m-entropy">—</strong></div>
        <div class="meter"><span>记忆</span><strong id="m-memory">—</strong></div>
      </div>

      <div
        class="drop"
        id="drop"
        tabindex="0"
        role="button"
        aria-label="拖放文件以浇灌记忆"
      >
        <div class="drop-ripple" aria-hidden="true"></div>
        <h2>浇一杯记忆</h2>
        <p>把日记、照片或文档轻轻放进来。<br />分身会重新长出未来三个月的路，旧的那张会收进抽屉。</p>
        <input id="fileInput" type="file" multiple hidden />
        <div class="drop-status" id="dropStatus">等你带来一点生活</div>
      </div>

      <label class="note-label" for="noteInput">随手写一句</label>
      <textarea
        id="noteInput"
        rows="3"
        placeholder="今天发生了什么… ⌘/Ctrl + Enter 送进去"
      ></textarea>
      <button type="button" class="btn btn-ghost" id="noteBtn">写入记忆</button>

      <div class="tool-row">
        <button type="button" class="btn btn-ghost" id="boardBtn">问一问</button>
        <button type="button" class="btn btn-ghost" id="simBtn">走一段</button>
      </div>

      <p class="rail-foot" id="healthLine">正在点灯…</p>
    </aside>

    <main class="stage">
      <section class="view view-chat" id="view-chat">
        <header class="stage-head">
          <span class="sys">和分身坐一会儿</span>
          <span class="sys dim" id="modelLine"></span>
        </header>
        <div class="log" id="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <textarea
            id="prompt"
            rows="1"
            placeholder="想说什么就说… Enter 送出，Shift+Enter 换行。提到「推演」或「做选择」时会认真算消耗"
            required
          ></textarea>
          <button class="btn" type="submit" id="sendBtn">送出</button>
        </form>
      </section>

      <section class="view view-paths hidden" id="view-paths">
        <header class="stage-head paths-head">
          <div>
            <span class="sys">接下来三个月</span>
            <p class="path-summary" id="pathSummary">正在铺开小路…</p>
            <p class="path-hint">拖节点改位置 · 空白处拖动画布 · 滚轮缩放</p>
          </div>
          <div class="path-actions">
            <button type="button" class="btn btn-ghost" id="resetCamBtn">回到中心</button>
            <button type="button" class="btn btn-ghost" id="regenPathBtn">重新想想</button>
          </div>
        </header>

        <div class="path-workspace">
          <svg id="pathSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="人生路径图"></svg>

          <aside class="inspector" id="inspector" hidden>
            <button type="button" class="inspector-close" id="inspectorClose" aria-label="关闭">×</button>
            <label>名字
              <input id="inspLabel" maxlength="40" />
            </label>
            <label>这句话
              <textarea id="inspDetail" rows="4" maxlength="800"></textarea>
            </label>
            <p class="insp-deltas" id="inspDeltas"></p>
            <p class="insp-hint" id="inspHint">改完会自动记住。</p>
          </aside>
        </div>

        <details class="history-drawer" id="historyDrawer">
          <summary>
            以前的地图
            <span class="sys dim" id="historyCount">0</span>
          </summary>
          <div class="history-list" id="historyList"></div>
        </details>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="overlay" aria-hidden="true">
    <div class="modal">
      <h3 id="modalTitle">想一想</h3>
      <textarea id="modalInput" rows="4"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel">先算了</button>
        <button type="button" class="btn" id="modalOk">开始</button>
      </div>
    </div>
  </div>

  <script src="/assets/life-path.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
